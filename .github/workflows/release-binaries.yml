name: Build and Release Linux Binary

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libusb-1.0-0 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v -s tests

      - name: Build Linux executable
        run: |
          export PYTHON_BIN="$(command -v python)"
          bash ./scripts/build_linux.sh

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp -f dist/linux/SerialMonitor release/SerialMonitor-linux
          chmod +x release/SerialMonitor-linux
          tar -C dist/linux -czf release/SerialMonitor-linux.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialMonitor-linux
          path: |
            release/SerialMonitor-linux
            release/SerialMonitor-linux.tar.gz

  publish-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SerialMonitor-linux
          path: release

      - name: Generate checksums
        run: |
          cd release
          sha256sum SerialMonitor-linux SerialMonitor-linux.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SerialMonitor-linux
            release/SerialMonitor-linux.tar.gz
            release/SHA256SUMS.txt
